spring:
  application:
    name: tracking-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/tracking}
    username: ${DB_USER:tracking}
    password: ${DB_PASS:tracking}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; Hibernate only validates
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    consumer:
      group-id: tracking-service
      auto-offset-reset: earliest
      enable-auto-commit: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

# Legacy MySQL connection (only used when DUAL_WRITE_ENABLED=true)
legacy:
  mysql:
    url: ${LEGACY_DB_URL:jdbc:mysql://localhost:3306/northwind}
    username: ${LEGACY_DB_USER:root}
    password: ${LEGACY_DB_PASS:root}

# Feature flag — set to false once all PHP monolith readers have been migrated
dual-write:
  enabled: ${DUAL_WRITE_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.northwind.tracking: INFO
    # Uncomment to trace SQL during debugging:
    # org.hibernate.SQL: DEBUG
    # org.hibernate.type.descriptor.sql: TRACE
