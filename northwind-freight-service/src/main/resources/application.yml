spring:
  application:
    name: freight-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/freight}
    username: ${DB_USER:freight}
    password: ${DB_PASS:freight}
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: application/json

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.northwind.freight: INFO
    org.springframework.web: WARN
    org.flywaydb: INFO
