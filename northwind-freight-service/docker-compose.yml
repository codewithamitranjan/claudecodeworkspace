version: "3.9"

# ----------------------------------------------------------------
# Northwind Freight Rating Service — local development stack
#
# Usage:
#   mvn package -DskipTests            # build the fat-jar first
#   docker-compose up --build          # build image + start both services
#   docker-compose down -v             # tear down and remove volumes
# ----------------------------------------------------------------

services:

  freight-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: northwind/freight-service:local
    container_name: freight-service
    ports:
      - "8080:8080"
    environment:
      DB_URL:  jdbc:postgresql://db:5432/freight
      DB_USER: freight
      DB_PASS: freight
      # Tune JVM heap for local dev (override with -e PORT=... etc.)
      JAVA_TOOL_OPTIONS: "-Xmx512m"
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  db:
    image: postgres:15-alpine
    container_name: freight-db
    environment:
      POSTGRES_DB:       freight
      POSTGRES_USER:     freight
      POSTGRES_PASSWORD: freight
    ports:
      - "5432:5432"
    volumes:
      - freight_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freight -d freight"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  freight_pgdata:
    driver: local
