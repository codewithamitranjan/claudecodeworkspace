server:
  port: 8080

spring:
  application:
    name: employee-service

  profiles:
    active: dev

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # PostgreSQL (used in prod profile — override via env vars)
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/employeedb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

# Spring Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

# App info exposed via /actuator/info
info:
  app:
    name: employee-service
    version: 1.0.0
    description: Employee CRUD Microservice

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.example.employeeservice: INFO
    org.hibernate.SQL: WARN

---
# Dev profile — uses H2 in-memory DB
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:employeedb;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console
